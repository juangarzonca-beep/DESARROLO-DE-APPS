<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons>
    <ion-title>Textarea</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-item>
    <ion-textarea
      label="Comentarios"
      placeholder="Escribe tu comentario aquí..."
      [autoGrow]="true"
      rows="4">
    </ion-textarea>
  </ion-item>

  <ion-item>
    <ion-textarea
      label="Con contador"
      placeholder="Máximo 100 caracteres"
      counter="true"
      maxlength="100">
    </ion-textarea>
  </ion-item>
</ion-content>
