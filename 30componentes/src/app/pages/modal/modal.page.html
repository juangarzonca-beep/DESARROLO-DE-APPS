<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons>
    <ion-title>Modal</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-button id="abrir-modal">Abrir modal</ion-button>

  <ion-modal #modal trigger="abrir-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Detalle</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="modal.dismiss()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <p>Este es el contenido del modal.</p>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
