<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons>
    <ion-title>List</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-list inset="true">
    <ion-list-header>
      <ion-label>Frutas</ion-label>
    </ion-list-header>
    @for (fruta of frutas; track fruta) {
      <ion-item>
        <ion-label>{{ fruta }}</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
