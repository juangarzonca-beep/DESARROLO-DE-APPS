<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons>
    <ion-title>Input</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-input label="Nombre" placeholder="Escribe tu nombre"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Correo" type="email" placeholder="correo@ejemplo.com"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Contraseña" type="password" placeholder="••••••••"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Deshabilitado" value="No editable" disabled="true"></ion-input>
    </ion-item>
  </ion-list>
</ion-content>
