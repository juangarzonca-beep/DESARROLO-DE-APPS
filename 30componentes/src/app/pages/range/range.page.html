<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons>
    <ion-title>Range</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-label>Volumen</ion-label>
  <ion-range [value]="50">
    <ion-icon slot="start" name="volume-low"></ion-icon>
    <ion-icon slot="end" name="volume-high"></ion-icon>
  </ion-range>

  <ion-label>Rango doble con pasos</ion-label>
  <ion-range dualKnobs="true" [value]="{lower: 20, upper: 70}" step="10" snaps="true" pin="true"></ion-range>
</ion-content>
