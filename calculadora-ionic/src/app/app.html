<ion-header>
  <ion-toolbar>
    <ion-title>Calculadora</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="calculadora">
    <ion-item>
      <ion-input
        label="num1"
        label-placement="stacked"
        type="number"
        [(ngModel)]="num1"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-select label="Op." label-placement="stacked" [(ngModel)]="operador">
        <ion-select-option value="+">+</ion-select-option>
        <ion-select-option value="-">-</ion-select-option>
        <ion-select-option value="*">*</ion-select-option>
        <ion-select-option value="/">/</ion-select-option>
        <ion-select-option value="%">%</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-input
        label="num2"
        label-placement="stacked"
        type="number"
        [(ngModel)]="num2"
      ></ion-input>
    </ion-item>

    <ion-button expand="block" class="ion-margin-top" (click)="operar()">
      Operar
    </ion-button>

    <p class="resultado">Resultado = {{ resultado }}</p>

    <div class="historial" *ngIf="historial.length > 0">
      <div class="historial-header">
        <h3>Historial</h3>
        <ion-button
          size="small"
          fill="outline"
          color="danger"
          (click)="limpiarHistorial()"
        >
          Limpiar
        </ion-button>
      </div>
      <ion-list>
        <ion-item *ngFor="let item of historial">
          <ion-label>{{ item }}</ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>
</ion-content>
